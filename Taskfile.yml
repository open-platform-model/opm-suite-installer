version: "3"

# Canonical OPM registry mapping (workspace Registry Policy): every OPM domain
# resolves from GHCR, anonymously. Override with REGISTRY=... if you must.
env:
  CUE_REGISTRY: '{{.REGISTRY}}'
  OPM_REGISTRY: '{{.REGISTRY}}'

vars:
  REGISTRY: '{{.REGISTRY | default "opmodel.dev=ghcr.io/open-platform-model,testing.opmodel.dev=ghcr.io/open-platform-model,registry.cue.works"}}'
  IMAGE: '{{.IMAGE | default "localhost/opm-suite-installer"}}'
  TAG: '{{.TAG | default "dev"}}'
  # kind cluster name. kubectl context becomes kind-<CLUSTER>.
  CLUSTER: '{{.CLUSTER | default "opm-suite"}}'
  KIND_CONFIG: hack/kind-cluster.yaml
  # Empty means kind's own default node image. Override to pin a Kubernetes
  # version: NODE_IMAGE=kindest/node:v1.34.0
  NODE_IMAGE: '{{.NODE_IMAGE | default ""}}'
  # Seconds to wait for the installer Job to finish in task job:run.
  JOB_TIMEOUT: '{{.JOB_TIMEOUT | default "420"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  lint:
    desc: Shellcheck every script, the per-application hooks included
    cmds:
      - |
        set -euo pipefail
        files=$(find . -path ./.git -prune -o -type f \
                  \( -name '*.sh' -o -path './scripts/*' \
                     -o -name 'pre-apply' -o -name 'on-failure' \) \
                  ! -name '*.md' -print | sort -u)
        if [ -z "$files" ]; then echo "no scripts yet"; exit 0; fi
        echo "$files" | xargs shellcheck -x

  vendor:sync:
    desc: Refresh vendor/ from the published source of every platform dependency
    cmds:
      - ./hack/vendor-sync.sh

  build:
    desc: Build the installer image
    cmds:
      - |
        set -euo pipefail
        if [ ! -f Containerfile ]; then
          echo "no Containerfile yet; nothing to build"
          exit 0
        fi
        podman build --build-arg SUITE_VERSION='{{.TAG}}' -t '{{.IMAGE}}:{{.TAG}}' .

  image:render:
    desc: Prove the built image still renders offline (no network, empty CUE cache)
    cmds:
      - IMAGE='{{.IMAGE}}' TAG='{{.TAG}}' ./hack/image-render.sh

  check:
    desc: Everything a change must pass
    cmds:
      - task: lint
      - task: build
      - task: image:render

  # The cluster half of the experiment. deploy/ is applied with host-side
  # kubectl, which is allowed: the image is the thing under test, the host is
  # not. Nothing here prepares the cluster for the image; the Job bootstraps
  # the CRDs itself.
  job:run:
    desc: Run the installer Job on the test cluster and print its log
    silent: true
    cmds:
      - |
        set -euo pipefail
        ctx='kind-{{.CLUSTER}}'
        # Refuse when the image is not loaded: imagePullPolicy is Never, so a
        # missing image fails slowly as ErrImageNeverPull instead of at once.
        if ! docker exec '{{.CLUSTER}}-control-plane' crictl images -q '{{.IMAGE}}:{{.TAG}}' 2>/dev/null | grep -q .; then
          echo "REFUSING: {{.IMAGE}}:{{.TAG}} is not loaded into cluster '{{.CLUSTER}}'." >&2
          echo "Run 'task build' then 'task cluster:load' first." >&2
          exit 1
        fi
        # A re-run is one command: the previous Job goes first, so each run
        # has exactly one pod and one log.
        kubectl --context "$ctx" delete job opm-suite-installer -n opm-suite --ignore-not-found --wait=true
        kubectl --context "$ctx" apply -f deploy/namespace.yaml -f deploy/serviceaccount.yaml -f deploy/rbac.yaml
        kubectl --context "$ctx" apply -f deploy/job.yaml
        echo
        echo "waiting for the Job to finish (timeout {{.JOB_TIMEOUT}})"
        deadline=$(( $(date +%s) + {{.JOB_TIMEOUT}} ))
        result=""
        while [ "$(date +%s)" -lt "$deadline" ]; do
          s=$(kubectl --context "$ctx" get job opm-suite-installer -n opm-suite \
                -o jsonpath='{.status.succeeded}/{.status.failed}')
          case "$s" in
            1/*) result=complete; break ;;
            */1) result=failed; break ;;
          esac
          sleep 2
        done
        echo
        echo "--- installer log ---"
        kubectl --context "$ctx" logs -n opm-suite job/opm-suite-installer || true
        echo "--- end of log ---"
        echo
        case "$result" in
          complete) echo "Job Complete" ;;
          failed)
            echo "Job Failed: container exit $(kubectl --context "$ctx" get pod -n opm-suite -l batch.kubernetes.io/job-name=opm-suite-installer -o jsonpath='{.items[0].status.containerStatuses[0].state.terminated.exitCode}')" >&2
            exit 1 ;;
          *) echo "Job did not finish within {{.JOB_TIMEOUT}}s" >&2; exit 1 ;;
        esac
        kubectl --context "$ctx" get moduleinstance,deploy,svc,pods -n opm-suite

  job:logs:
    desc: Print the installer Job's log
    cmds:
      - kubectl --context 'kind-{{.CLUSTER}}' logs -n opm-suite job/opm-suite-installer

  # Deliberately bare. This task creates a stock Kubernetes cluster and stops:
  # no OPM operator, no CRDs, no Platform. Bootstrapping those is the installer
  # image's job, and it is the thing the experiment is testing. A cluster that
  # arrives pre-prepared proves nothing.
  cluster:up:
    desc: Create a bare kind test cluster (no OPM operator, on purpose)
    cmds:
      - |
        set -euo pipefail
        if kind get clusters 2>/dev/null | grep -qx '{{.CLUSTER}}'; then
          echo "cluster '{{.CLUSTER}}' already exists"
          # A reused cluster that already carries OPM CRDs is not a valid
          # starting line: whatever put them there did the image's job for it.
          if kubectl --context 'kind-{{.CLUSTER}}' get crd -o name 2>/dev/null \
               | grep -q opmodel.dev; then
            echo
            echo "REFUSING: this cluster already has OPM CRDs installed." >&2
            echo "The experiment tests whether the installer image can bootstrap a bare" >&2
            echo "cluster, so a pre-prepared one proves nothing." >&2
            echo "Run 'task cluster:down' then 'task cluster:up' for a clean start." >&2
            exit 1
          fi
        else
          args=(create cluster --name '{{.CLUSTER}}' --config '{{.KIND_CONFIG}}' --wait 120s)
          if [ -n '{{.NODE_IMAGE}}' ]; then args+=(--image '{{.NODE_IMAGE}}'); fi
          kind "${args[@]}"
        fi
        echo
        echo "Bare cluster ready. No OPM CRDs, no operator, no Platform."
        echo "Installing those is the installer image's job."

  cluster:load:
    desc: Load the locally built installer image into the kind cluster
    cmds:
      - |
        set -euo pipefail
        archive=$(mktemp -t opm-suite-installer-XXXXXX.tar)
        trap 'rm -f "$archive"' EXIT
        podman save -o "$archive" '{{.IMAGE}}:{{.TAG}}'
        kind load image-archive "$archive" --name '{{.CLUSTER}}'

  cluster:status:
    desc: Show what the test cluster is running
    cmds:
      - |
        set -euo pipefail
        if ! kind get clusters 2>/dev/null | grep -qx '{{.CLUSTER}}'; then
          echo "cluster '{{.CLUSTER}}' does not exist"
          exit 0
        fi
        kubectl --context 'kind-{{.CLUSTER}}' version -o yaml | grep -E 'gitVersion|^server' || true
        echo
        kubectl --context 'kind-{{.CLUSTER}}' get nodes
        echo
        kubectl --context 'kind-{{.CLUSTER}}' get crd -o name | grep opmodel.dev \
          || echo "no OPM CRDs (expected on a bare cluster; the installer image bootstraps them)"
        echo
        kubectl --context 'kind-{{.CLUSTER}}' get platform,moduleinstance -A 2>/dev/null || true

  cluster:down:
    desc: Delete the kind test cluster
    cmds:
      - |
        set -euo pipefail
        if ! kind get clusters 2>/dev/null | grep -qx '{{.CLUSTER}}'; then
          echo "cluster '{{.CLUSTER}}' does not exist; nothing to delete"
          exit 0
        fi
        kind delete cluster --name '{{.CLUSTER}}'
