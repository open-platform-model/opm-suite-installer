name: Cite lint

# The comment rule of the enhancements store, run by the shared reusable
# workflow of open-platform-model/.github (its README, "cite-lint"). The tool
# commit lives in that workflow; `task cite-lint` runs the same tool at the
# same commit. The repo only reads: no secret, read-only token.
# No excludes: the tree has 0 findings. If one is added, keep it equal to the
# --exclude flags of the Taskfile.yml task cite-lint.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  cite-lint:
    name: Cite lint
    permissions:
      contents: read
    uses: open-platform-model/.github/.github/workflows/cite-lint.yml@2b66da51fede4332969c324b069012632d8edea9 # .github main
    with:
      paths: .
